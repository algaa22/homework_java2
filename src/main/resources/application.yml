server:
  port: 8081

spring:
  application:
    name: todolist
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}


app:
  name: ToDoList
  version: 2.0.0
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true