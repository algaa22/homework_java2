services:
  postgres:
    image: postgres:15-alpine
    container_name: todolist-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todolist_db}
      POSTGRES_USER: ${POSTGRES_USER:-todolist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - todolist-network
    env_file:
      - .env

  pgadmin:
    image: dpage/pgadmin4
    container_name: todolist-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - todolist-network
    env_file:
      - .env

volumes:
  postgres_data:

networks:
  todolist-network:
    driver: bridge